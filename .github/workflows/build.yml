name: Build
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip kurdistan-client.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.0
      - run: gradle build
        working-directory: kurdistan-client
      - uses: actions/upload-artifact@v4
        with:
          name: kurdistan-client-jar
          path: kurdistan-client/build/libs/kurdistan-client-1.0.0.jar
